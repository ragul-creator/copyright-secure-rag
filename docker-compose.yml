services:
  api:
    build: .
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      OPA_URL: http://opa:8181/v1/data/copyright/decision
      OPA_RIGHTS_URL: http://opa:8181/v1/data/rights/decision
      FAIL_CLOSED: "true"
      AUTH_MODE: disabled
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      opa: {condition: service_started}
  ui:
    build: .
    command: streamlit run apps/ui/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
      PYTHONPATH: /app
    ports: ["8501:8501"]
    depends_on: [api]
  opa:
    image: openpolicyagent/opa:latest
    command: ["run","--server","--log-level=info","/policies"]
    volumes: ["./policies/opa:/policies:ro"]
    ports: ["8181:8181"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:latest
    volumes:
      - "./infra/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  qdrant_data:
  pg_data:
