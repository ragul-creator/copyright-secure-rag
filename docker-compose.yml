services:
  api:
    build: .
    environment:
      PYTHONPATH: /app
      OPA_URL: http://opa:8181/v1/data/copyright/decision
      FAIL_CLOSED: "true"
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on: [opa]
  ui:
    build: .
    command: streamlit run apps/ui/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
      PYTHONPATH: /app
    ports: ["8501:8501"]
    depends_on: [api]
  opa:
    image: openpolicyagent/opa:latest
    command: ["run","--server","--log-level=info","/policies"]
    volumes: ["./policies/opa:/policies:ro"]
    ports: ["8181:8181"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:latest
    volumes:
      - "./infra/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  qdrant_data:
  pg_data:
